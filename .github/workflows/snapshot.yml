name: TPEx daily snapshot

on:
  schedule:
    # GitHub may start scheduled runs hours late, so several runs are spread out and each one
    # backfills whatever recent weekday is still missing (times below are Asia/Taipei).
    - cron: '7 7 * * 1-5'    # 15:07 quotes
    - cron: '41 8 * * 1-5'   # 16:41 法人 / 本益比
    - cron: '13 10 * * 1-5'  # 18:13
    - cron: '47 13 * * 1-5'  # 21:47 融資
    - cron: '23 0 * * 2-6'   # 08:23 next morning catch-up
  workflow_dispatch:
    inputs:
      date:
        description: 'Date (YYYY-MM-DD); empty = backfill missing weekdays of the last 7 days'
        required: false

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch official TPEx datasets
        run: node scripts/snapshot.mjs "${{ github.event.inputs.date }}"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tpex
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "snapshot: TPEx (latest $(jq -r .date tpex/latest.json))"
          git push
